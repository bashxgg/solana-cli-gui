# Build macOS Apple Silicon installer and attach to a GitHub Release.
# Trigger: push a version tag (v0.1.0) or run manually from Actions.
#
# Requires: nothing extra for unsigned builds (GITHUB_TOKEN is enough).
# Optional later: Apple notarization secrets.
# Platform: macOS Apple Silicon (aarch64) only — no Intel / Windows / Linux.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-aarch64

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced from tauri.conf.json / package version
          tagName: v__VERSION__
          releaseName: "solana cli v__VERSION__"
          releaseBody: |
            Desktop GUI for the Solana CLI (Tauri) — **macOS Apple Silicon only**.

            **Requires** `solana`, `solana-keygen`, and `spl-token` installed separately on your machine.

            ### Install notes
            - Open the `.dmg` (arm64 / Apple Silicon), drag to Applications.
            - If macOS says the app is "damaged", run:
              `xattr -cr "/Applications/solana cli.app"` then open again.
            - Install Solana CLI: https://docs.solana.com/cli/install-solana-cli-tools

            Intel Macs, Windows, and Linux are not supported for prebuilt releases.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
