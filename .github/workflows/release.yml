# Build macOS Apple Silicon installer and attach to a GitHub Release.
# Trigger: push a version tag (v0.1.0) or run manually from Actions.
#
# Requires: nothing extra for unsigned builds (GITHUB_TOKEN is enough).
# Optional later: Apple notarization secrets.
# Platform: macOS Apple Silicon (aarch64) only — no Intel / Windows / Linux.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-aarch64

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced from tauri.conf.json / package version
          tagName: v__VERSION__
          releaseName: "solana cli v__VERSION__"
          releaseBody: |
            Desktop GUI for the Solana CLI (Tauri) — **macOS Apple Silicon only**.

            **Requires** `solana`, `solana-keygen`, and `spl-token` installed separately.

            ### Install (recommended — avoids “app is damaged”)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/bashxgg/solana-cli-gui/main/scripts/install-macos.sh | bash
            ```

            ### Manual
            - Download the arm64 `.dmg`, drag to Applications.
            - If Gatekeeper says **damaged**:
              `xattr -cr "/Applications/solana cli.app" && codesign --force --deep --sign - "/Applications/solana cli.app"`
            - Solana CLI: https://docs.solana.com/cli/install-solana-cli-tools
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
