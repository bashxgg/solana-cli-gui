# Build signed + notarized macOS Apple Silicon DMG for GitHub Releases.
#
# Without Apple Developer secrets, Gatekeeper will still show “app is damaged”
# for browser downloads. Ad-hoc signing is NOT enough for internet distribution.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE          base64 of Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password for that .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                   Apple ID email
#   APPLE_PASSWORD             app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID              10-char Team ID
#
# Setup guide: docs/MACOS_SIGNING.md

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret: $v — see docs/MACOS_SIGNING.md"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Cannot ship a Gatekeeper-clean DMG without Apple Developer ID + notarization."
            exit 1
          fi
          echo "All Apple signing secrets present."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-aarch64

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign, notarize, upload Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "solana cli v__VERSION__"
          releaseBody: |
            Desktop GUI for the Solana CLI (Tauri) — **macOS Apple Silicon**.

            **Requires** `solana`, `solana-keygen`, and `spl-token` on your PATH.

            ### Install
            1. Download `solana.cli_*_aarch64.dmg`
            2. Open → drag **solana cli** to Applications → open

            Signed & notarized with Apple Developer ID (no “damaged” dialog).
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
